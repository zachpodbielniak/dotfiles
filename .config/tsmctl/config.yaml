# ~/.config/tsmctl/config.yaml - tsmctl settings (simple YAML; CLI and env win)

# Machine that runs WoW. Leave empty (or set to this machine's hostname) to
# read the local install. Remote reads are ssh + find/tar only.
host: mob-zach

# WoW install root on that machine (~ is the remote $HOME) and game flavor.
wow_dir: "~/.var/app/com.valvesoftware.Steam/.local/share/Steam/steamapps/compatdata/2555556235/pfx/drive_c/Program Files (x86)/World of Warcraft"
flavor: _retail_

# Only read these WoW account folders (default: all).
# accounts:
#   - ZAKMANN

# SavedVariables to read: tsm, datastore (Altoholic), syndicator (Baganator).
# Default: every one present. TSM is optional too.
# sources: [tsm, datastore, syndicator]

# Logins: every WoW account folder (WTF/Account/<folder>) is one login.
# A label per folder, shown beside the folder and sent to VENTURE as the
# login's name; --login (an alias of --account) takes a label as well.
# Without one, a Battle.net licence folder <number>#<n> is labelled WoW<n>
# (as the launcher shows it) and any other folder keeps its own name.
# account_labels:
#   ZAKMANN: Main
#   "12345678#1": Alt      # instead of the default WoW1
# Folders that belong to one Battle.net account. The group is the login's
# group in VENTURE, and --login takes a group name to mean all its folders.
# battlenet_groups:
#   bnet-main: [ZAKMANN, "12345678#1"]
# Warband banks: per_account (default: one per folder, warbank:<folder>) or
# shared (the folders of a battlenet_groups entry share one bank,
# warbank:<group>: the freshest copy wins, nothing is ever summed).
# warband: per_account

# More than one machine: each entry is read like host/wow_dir/flavor above
# (which are its defaults) and the data merged. A folder name found on two
# machines is refused unless a prefix tells them apart; the prefix becomes
# part of that login's name. --host, --local or --wow-dir reads one install.
# hosts:
#   - host: mob-zach
#     accounts: [ZAKMANN, "12345678#1"]
#   - host: laptop
#     wow_dir: "~/Games/World of Warcraft"
#     prefix: laptop-

# Realm used for account-wide items (warbank) and deals when --realm is absent.
# realm: Thorium Brotherhood

# How holdings are valued. price_source is the minimum (what actually sells:
# region sale average capped at realm market, vendor price if it never sells)
# and is used everywhere; market_source is the optimistic market-price view
# shown next to it by `networth` and `report`.
price_source: "check(dbregionsaleavg, min(dbmarket, dbregionsaleavg), vendorsell)"
market_source: "first(dbmarket, dbregionmarketavg, vendorsell)"
# Reference sell price for `deals`.
sell_source: "first(dbregionsaleavg, dbmarket)"
ah_cut: 5

# Where --save writes org reports, and the notes repo root (for index links).
report_dir: ~/Documents/notes/02_areas/personal/wow/retail/accounting
notes_dir: ~/Documents/notes

# Money format: g (1,234.56g), gsc (1,234g 56s 00c) or copper.
money: g

# Extra ssh options, e.g. a jump host.
# ssh_options:
#   - -J
#   - bastion

# Game region (the VENTURE export's venue group).
region: us

# `tsmctl venture push` (tsmctl-venture-push.service): the homelab VENTURE,
# the wow_retail organization's TSM push source. The token is in
# ~/.config/tsmctl/venture-token (chmod 600), never here.
venture_url: https://venture.podbielniak.com
venture_source: 2
venture_organization: 2
venture_currency: GOLD
venture_market: scope
# The crafts TSM knows go to the Blizzard source's recipe import on each
# push, when they changed; products for new items belong to venture 2.
venture_recipe_source: 1
venture_recipe_venture: 2
