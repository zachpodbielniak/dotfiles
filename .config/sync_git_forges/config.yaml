# sync_git_forges — reconcile owner/repo across Forgejo, GitLab, and GitHub
#
# Forgejo is canonical. It is supposed to push-mirror out to GitLab and GitHub;
# this file is the list of repos to double-check and, when GitLab/GitHub got
# commits first, merge back.
#
# Templates: {path} is owner/repo (or group/sub/repo), {owner} and {repo} also
# work. CLI --repos / positionals / --stdin replace the repos list below but
# still use these forge URLs.

forges:
  forgejo:
    url: "git@git-ssh.podbielniak.com:{path}.git"
  gitlab:
    url: "git@gitlab.com:{path}.git"
  github:
    url: "git@github.com:{path}.git"

canonical: forgejo

# Optional default branches for every repo. Empty / omitted means "whatever
# HEAD is on Forgejo". Per-repo `branches:` below overrides this.
# branches:
#   - master

# String form uses the same owner/repo on all three forges.
# Map form allows per-forge path overrides and a per-repo branch list.
repos:
  # - zachpodbielniak/dotfiles
  # - immutablue/immutablue
  # - copyleft-games/mcp-glib
  # - path: zachpodbielniak/gst
  #   forgejo: zachpodbielniak/gst
  #   gitlab: zachpodbielniak/gst
  #   github: zachpodbielniak/gst
  #   branches:
  #     - master
