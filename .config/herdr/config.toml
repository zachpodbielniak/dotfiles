# herdr configuration
# Stow target: ~/.config/herdr/config.toml
#
# Keybindings are mapped to tmux muscle memory (see .config/tmux/tmux.conf).
# Terminology mapping between the two:
#     tmux session  ->  herdr workspace
#     tmux window   ->  herdr tab
#     tmux pane     ->  herdr pane
#
# Reload after editing:  herdr server reload-config   (or prefix+r)
# Validate:              herdr config check
# Full default config:   herdr --default-config

# Onboarding was completed; do not show the first-run notification setup.
onboarding = false

[theme]
# "catppuccin" is the mocha flavor; "catppuccin-latte" is the light sibling.
name = "catppuccin"

# Exact catppuccin mocha hexes, pinned so a herdr theme revision cannot drift
# away from the palette tmux, gst, and cmacs already use.
#
# The accent is deliberately MAUVE while tmux's accent is SAPPHIRE (#74c7ec,
# from @catppuccin_window_current_background). herdr runs nested inside tmux,
# so the two multiplexers get two different accents: purple chrome is herdr
# (prefix C-b), blue chrome is tmux (prefix C-s). At a glance you know which
# layer a keystroke is going to land in.
[theme.custom]
accent        = "#cba6f7"   # mauve   - herdr's identity color
sidebar_bg    = "#181825"   # mantle  - sidebar sits below the pane surface
panel_bg      = "#1e1e2e"   # base
active_row_bg = "#313244"   # surface0
selection_bg  = "#45475a"   # surface1
red           = "#f38ba8"   # blocked / failed
green         = "#a6e3a1"   # idle / healthy
yellow        = "#f9e2af"   # working
blue          = "#89b4fa"
teal          = "#94e2d5"

[keys]
# Same prefix as tmux. Stated explicitly so a herdr default change cannot
# silently move it out from under the bindings below.
prefix = "ctrl+b"

# --- Session / global ------------------------------------------------------
# tmux: ?  list-keys
help = "prefix+?"
# tmux: d  detach-client
detach = "prefix+d"
# tmux: r  source-file (our tmux.conf rebinds r to reload; stock r is refresh).
reload_config = "prefix+r"
# No tmux equivalent. Pushed off prefix+s so s can be the session picker.
settings = "prefix+shift+s"
# No tmux equivalent; herdr default retained.
toggle_sidebar = "prefix+b"
open_notification_target = "prefix+shift+o"

# --- Workspaces (tmux sessions) --------------------------------------------
# tmux: s  choose-session
workspace_picker = "prefix+s"
# tmux: w  choose-tree (all sessions + windows)
goto = "prefix+w"
# tmux: $  rename-session
rename_workspace = "prefix+$"
# tmux: (  and  )  switch-client -p / -n
previous_workspace = "prefix+("
next_workspace = "prefix+)"
# No tmux default binding. Moved off prefix+shift+n so n/p can be next/prev
# agent; prefix+c is new tab, so shift+c is the workspace-level sibling.
new_workspace = "prefix+shift+c"
close_workspace = "prefix+shift+d"

# --- Agents (no tmux equivalent) -------------------------------------------
# n/p is next/prev. prefix+n is copy-mode and prefix+p is the popup, so
# these live on shift. Indexed jump matches switch_tab = prefix+1..9.
next_agent = "prefix+shift+n"
previous_agent = "prefix+shift+p"
focus_agent = "prefix+alt+1..9"

# --- Tabs (tmux windows) ---------------------------------------------------
# tmux: c  new-window
new_tab = "prefix+c"
# tmux: ,  rename-window
rename_tab = "prefix+,"
# tmux: &  kill-window
close_tab = "prefix+&"
# tmux: 1-9  select-window (herdr indexes tabs from 1, not 0)
switch_tab = "prefix+1..9"
# Our tmux.conf rebinds n -> copy-mode and p -> display-popup, so next/prev
# tab cannot live on prefix+n / prefix+p. ctrl+alt is the modifier family
# herdr documents as free across terminals and desktops; the prefix+ctrl
# variants are the fallback if the outer terminal eats the direct chord.
next_tab = ["ctrl+alt+]", "prefix+ctrl+n"]
previous_tab = ["ctrl+alt+[", "prefix+ctrl+p"]
# tmux convention: bind < swap-window -t -1 / bind > swap-window -t +1
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"

# --- Panes -----------------------------------------------------------------
# tmux: %  split-window -h  -> new pane to the RIGHT.
# herdr names splits after the divider, so "vertical" is the right-hand split.
split_vertical = "prefix+%"
# tmux: "  split-window -v  -> new pane BELOW.
split_horizontal = "prefix+\""
# tmux: x  kill-pane
close_pane = "prefix+x"
# tmux: z  resize-pane -Z
zoom = "prefix+z"
# tmux: ;  last-pane
last_pane = "prefix+;"
# tmux: o  select-pane -t :.+
cycle_pane_next = "prefix+o"
cycle_pane_previous = "prefix+ctrl+o"
# tmux: prefix + arrows is the stock pane movement; h/j/k/l is what
# vim-tmux-navigator trains. Both are bound.
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
# tmux: {  swap-pane -U  /  }  swap-pane -D
swap_pane_up = "prefix+{"
swap_pane_down = "prefix+}"
# No tmux equivalent (tmux swaps by index, not direction); herdr defaults.
swap_pane_left = "prefix+shift+h"
swap_pane_right = "prefix+shift+l"
# tmux: prefix + ctrl + arrows  resize-pane
resize_pane_left = "prefix+ctrl+left"
resize_pane_down = "prefix+ctrl+down"
resize_pane_up = "prefix+ctrl+up"
resize_pane_right = "prefix+ctrl+right"
# Modal resize has no tmux analogue; moved off prefix+r so r can reload.
resize_mode = "prefix+shift+r"
# No tmux equivalent. Moved off prefix+shift+p (previous agent).
rename_pane = "prefix+shift+a"

# --- Copy mode -------------------------------------------------------------
# tmux: [  copy-mode, plus our tmux.conf's "bind n copy-mode".
# herdr copy mode already uses vi motions (hjkl, w/b/e, v, y, /, n/N).
copy_mode = ["prefix+[", "prefix+n"]
# No tmux equivalent: dumps the pane scrollback into $EDITOR.
edit_scrollback = "prefix+e"

# --- Navigate mode ---------------------------------------------------------
# Local movement while the goto/navigate overlay is open. vi keys, matching
# tmux's mode-keys vi.
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# --- Custom commands -------------------------------------------------------
# tmux: bind-key p display-popup -E
# A popup is session-modal and closes when the shell exits, which is what
# display-popup -E does. Uses bash directly rather than $SHELL because herdr
# does not expand environment variables in command strings.
[[keys.command]]
key = "prefix+p"
type = "popup"
command = "bash"
width = "80%"
height = "80%"

# ===========================================================================
# UI
# ===========================================================================
[ui]
# tmux: set -g mouse on
mouse_capture = true
copy_on_select = true

# Same mauve as the theme accent, applied to borders and navigation UI.
accent = "#cba6f7"

# The tab bar carries the status segments below, so it must never auto-hide.
hide_tab_bar_when_single_tab = false

# herdr's tab bar sits at the TOP, tmux's status line at the BOTTOM. Nested,
# that reads as one stacked HUD instead of two competing status lines.
tab_bar_position = "top"

# herdr is inside tmux, which already draws a frame around the whole thing.
# Dropping herdr's outer border reclaims a row and a column and stops the
# doubled-border look; internal splitters between panes are kept.
pane_outer_borders = false
pane_borders = true
pane_gaps = true

# Attention-first ordering: agents needing input float to the top of the
# sidebar instead of staying pinned to their workspace group.
agent_panel_sort = "priority"

# Distinct glyphs per state rather than same-shape colored dots. Colorblind-
# safe and readable at a glance in a nested terminal.
status_indicators = "symbols"

# herdr writes this to the outer terminal, which here IS a tmux pane, so tmux
# picks it up as the window name. The tmux window list ends up showing the
# live herdr workspace and tab.
window_title = "{workspace} · {tab}"

# ---------------------------------------------------------------------------
# Status bar (tmux `status-right` equivalent)
#
# This bar deliberately does NOT repeat anything tmux already shows at the
# bottom (clock, cwd, days_since counters, pomo). Every segment here is
# something ONLY herdr or this host knows. Segments print nothing when they
# have nothing to say, so a quiet bar means a quiet system.
# ---------------------------------------------------------------------------
tab_bar_right_separator = "  "

# Agent rollup: blocked first, because blocked is the only state that means a
# human has to act. Silent when no agents are running.
[[ui.tab_bar_right]]
type = "command"
command = "herdr_status agents"
interval_seconds = 3
timeout_seconds = 2

# Which model ollama is currently holding in memory. Silent when nothing is
# resident.
[[ui.tab_bar_right]]
type = "command"
command = "herdr_status ollama"
interval_seconds = 15
timeout_seconds = 3

# Backing quadlets that are down. Silent when everything is healthy, so if
# this segment is visible at all, something is broken.
[[ui.tab_bar_right]]
type = "command"
command = "herdr_status services"
interval_seconds = 30
timeout_seconds = 5

# OS image state: a staged deployment waiting on a reboot, and whether the
# booted deployment is carrying a transient /usr overlay that the reboot will
# throw away. Changes rarely, so it polls slowly.
[[ui.tab_bar_right]]
type = "command"
command = "herdr_status bootc"
interval_seconds = 300
timeout_seconds = 5

# Built-in: shows when a pane is zoomed. Easy to forget you are zoomed when
# the outer tmux frame is still drawing a normal-looking window.
[[ui.tab_bar_right]]
type = "zoom"

# Resolves on the herdr SERVER, so when attached with `herdr --remote` this
# names the machine the panes actually run on, not this laptop. Worth a
# permanent slot given lt-zach / mob-zach / srv-zach / hacbook.
[[ui.tab_bar_right]]
type = "hostname"

# ---------------------------------------------------------------------------
# Sidebar row layouts
# ---------------------------------------------------------------------------
# Agent rows. $model and $summary are custom metadata tokens: they stay
# invisible until something reports them with
#     herdr pane report-metadata <pane> --source X --token summary=...
# so a custom harness can light them up without any config change.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "agent", bold = true }, { token = "$model", fg = "#9399b2" }],
  [{ token = "$summary", fg = "#cba6f7" }],
  [{ token = "workspace", fg = "#a6adc8" }, { token = "tab", fg = "#a6adc8" }],
]

# Space rows: name on top, git state beneath it in a dimmer weight.
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", { token = "workspace", bold = true }],
  [{ token = "branch", fg = "#89b4fa" }, { token = "git_status", dim = true }],
]

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
# Nested in tmux inside gst, an in-app toast is the only popup guaranteed to
# land where you are actually looking.
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"
